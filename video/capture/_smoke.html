<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #11111b;
        color: #cdd6f4;
        font: 16px/1.5 system-ui, sans-serif;
        overflow: hidden;
      }
      #box {
        position: absolute;
        left: 0;
        top: 0;
        width: 200px;
        height: 200px;
        background: #89b4fa;
      }
      #readout {
        position: absolute;
        left: 16px;
        top: 240px;
      }
    </style>
  </head>
  <body>
    <div id="box"></div>
    <div id="readout"></div>
    <script>
      window.renderScene = (t) => {
        document.getElementById('box').style.transform = `translateX(${t * 100}px)`
        document.getElementById('readout').textContent = `t=${t.toFixed(3)}`
      }
      window.renderScene(0)
    </script>
  </body>
</html>
